[package]
name = "susuko-bunko"
version = "0.7.0"
description = "Susuko Bunko - light novel and manga reader"
edition = "2021"

[lib]
name = "susuko_bunko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
opt-level = "s"
